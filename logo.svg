<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#162235" />
      <stop offset="100%" stop-color="#0b0f17" />
    </radialGradient>
    
    <!-- Emerald Gradient for Wallet/Rays -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Indigo Gradient for Charts -->
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Coin Glow -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle circular accent halo -->
  <circle cx="256" cy="240" r="160" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Analytics Rising Bars (Behind Coin) -->
  <rect x="130" y="270" width="36" height="90" rx="10" fill="url(#chartGrad)" opacity="0.6" />
  <rect x="180" y="220" width="36" height="140" rx="10" fill="url(#chartGrad)" opacity="0.8" />
  <rect x="230" y="170" width="36" height="190" rx="10" fill="url(#emeraldGrad)" />
  <rect x="280" y="240" width="36" height="120" rx="10" fill="url(#chartGrad)" opacity="0.8" />
  <rect x="330" y="200" width="36" height="160" rx="10" fill="url(#emeraldGrad)" />

  <!-- Center INR Currency Coin -->
  <circle cx="256" cy="240" r="105" fill="#0b0f17" stroke="url(#emeraldGrad)" stroke-width="12" />
  
  <!-- INR Symbol (₹) Vector Path -->
  <!-- Top Horizontal Bar -->
  <rect x="206" y="176" width="100" height="15" rx="7.5" fill="url(#emeraldGrad)" />
  <!-- Second Horizontal Bar -->
  <rect x="206" y="208" width="86" height="15" rx="7.5" fill="url(#emeraldGrad)" />
  <!-- Stem & Curve of R -->
  <path d="M 230,176 L 230,304 M 230,191 C 275,191 292,204 292,236 C 292,268 268,272 230,272 M 245,268 L 285,304" 
        stroke="url(#emeraldGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
